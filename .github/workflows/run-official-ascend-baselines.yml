name: Request Official Ascend Baseline

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: Active target ID from the official registry
        required: true
        type: string
      repeat_count:
        description: Independent complete service lifecycles
        required: true
        type: number
        default: 3
      priority:
        required: true
        type: choice
        options: [release, required, normal, diagnostic]
        default: required

permissions:
  contents: read

jobs:
  submit-to-112:
    uses: vLLM-HUST/vllm-hust-dev-hub/.github/workflows/evaluation-request.yml@main
    with:
      repository: vllm-project/vllm
      core_revision: bcf2be96120005e9aea171927f85055a6a5c0cf6 # pragma: allowlist secret
      plugin_repository: vllm-project/vllm-ascend
      plugin_revision: e18643f8a4d5bd9990727654318ad069ea0b56e2 # pragma: allowlist secret
      target_id: ${{ inputs.target_id }}
      target_registry_version: 1.3.5
      repeat_count: ${{ inputs.repeat_count }}
      npu_count: 1
      priority: ${{ inputs.priority }}
    secrets:
      evaluation_api_url: ${{ secrets.EVALUATION_API_URL }}
      evaluation_api_token: ${{ secrets.EVALUATION_API_TOKEN }}
      evaluation_hmac_secret: ${{ secrets.EVALUATION_HMAC_SECRET }}
