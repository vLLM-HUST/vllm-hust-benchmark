name: Upload Benchmark Results to HuggingFace

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (do not upload to HF)'
        type: boolean
        default: false
      backfill_existing_only:
        description: 'Backfill and republish already-hosted HF submissions without new local submissions'
        type: boolean
        default: false
      submission_dirs:
        description: 'Optional newline-separated submission directories to sync'
        type: string
        required: false
      website_ref:
        description: 'Optional vllm-hust-website ref to use for aggregation/schema checkout'
        type: string
        required: false
      skip_aggregation:
        description: 'Skip re-aggregation and directly upload existing leaderboard-data/snapshots/ files'
        type: boolean
        default: false

env:
  VLLM_HUST_WEBSITE_REF: ${{ github.event.inputs.website_ref || vars.VLLM_HUST_WEBSITE_REF || 'main' }}

permissions:
  contents: read

jobs:
  upload-to-hf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout vllm-hust repo
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust
          path: vllm-hust
          persist-credentials: false

      - name: Checkout website repo (for aggregate script and schema)
        uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/vllm-hust-website
          ref: ${{ env.VLLM_HUST_WEBSITE_REF }}
          path: vllm-hust-website
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e . jsonschema "huggingface_hub>=0.20"

      - name: Validate all submission artifacts
        run: |
          python - << 'PYEOF'
          import json, sys
          from pathlib import Path
          from jsonschema import Draft7Validator
          from vllm_hust_benchmark.submission_artifacts import validate_manifest_artifacts

          schema_path = Path("vllm-hust-website/data/schemas/leaderboard_v1.schema.json")
          if not schema_path.exists():
              print("No schema found — skipping validation")
              sys.exit(0)

          schema = json.loads(schema_path.read_text())
          validator = Draft7Validator(schema)
          errors_found = False

          manifests = sorted(Path("submissions").rglob("leaderboard_manifest.json"))
          if not manifests:
              print("No submission manifests found — nothing to do")
              sys.exit(0)

          errors = validate_manifest_artifacts(manifests=manifests, validator=validator)
          if errors:
              errors_found = True
              for error in errors:
                  print(f"FAIL {error}")
          else:
              for manifest_path in manifests:
                  print(f"OK   {manifest_path}")

          sys.exit(1 if errors_found else 0)
          PYEOF

      - name: Validate trend admission on submission artifacts before aggregation
        id: validate-trend-submissions
        run: |
          python - << 'PYEOF'
          import json, sys
          from pathlib import Path
          from vllm_hust_benchmark.trend_validator import load_json_entries, validate_entries

          submissions_root = Path("submissions")
          manifests = sorted(submissions_root.rglob("leaderboard_manifest.json"))
          if not manifests:
              print("No submission manifests found — skipping trend validation")
              sys.exit(0)

          all_entries = []
          for manifest_path in manifests:
              try:
                  payload = json.loads(manifest_path.read_text(encoding="utf-8"))
              except (ValueError, OSError) as exc:
                  print(f"WARNING: cannot load {manifest_path}: {exc}")
                  continue
              for record in payload.get("entries", []):
                  artifact_rel = record.get("leaderboard_artifact")
                  if not artifact_rel:
                      continue
                  artifact_path = manifest_path.parent / artifact_rel
                  if not artifact_path.is_file():
                      print(f"WARNING: {artifact_path} not found")
                      continue
                  try:
                      all_entries.extend(load_json_entries(artifact_path))
                  except (ValueError, OSError) as exc:
                      print(f"WARNING: {artifact_path}: {exc}")
                      continue

          if not all_entries:
              print("No submission entries to validate")
              sys.exit(0)

          report = validate_entries(all_entries)
          for decision in report.decisions:
              print(f"  {decision.status:12} {decision.entry_id}: {decision.reason}")
          for issue in report.issues:
              print(f"  {issue.severity.upper():5} {issue.code}: {issue.entry_id}: {issue.message}")

          if not report.passed:
              print("\nFAIL: Trend admission validation blocked — submission contains invalid entries",
                    file=sys.stderr)
              sys.exit(1)

          print(f"\nOK: {len(report.decisions)} submission entry(s) passed trend validation")
          PYEOF

      - name: Resolve submission directories to sync
        id: resolve-submissions
        run: |
          python - << 'PYEOF'
          import os
          import subprocess
          from pathlib import Path

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          before_sha = os.environ.get("BEFORE_SHA", "")
          current_sha = os.environ.get("GITHUB_SHA", "")
          backfill_existing_only = os.environ.get("BACKFILL_EXISTING_ONLY", "").lower() == "true"
          manual_submission_dirs = os.environ.get("MANUAL_SUBMISSION_DIRS", "")
          submissions_root = Path("submissions")
          snapshot_root = Path("leaderboard-data/snapshots")

          def collect_changed_paths(diff_args: list[str]) -> list[Path]:
              diff_output = subprocess.check_output(diff_args, text=True)
              return [Path(raw_path.strip()) for raw_path in diff_output.splitlines() if raw_path.strip()]

          def collect_submission_dirs(changed_paths: list[Path]) -> list[str]:
              resolved_dirs: list[str] = []
              seen: set[str] = set()
              for path in changed_paths:
                  if len(path.parts) < 2 or path.parts[0] != "submissions":
                      continue
                  candidate = submissions_root / path.parts[1]
                  manifest = candidate / "leaderboard_manifest.json"
                  if manifest.is_file():
                      resolved = str(candidate.resolve())
                      if resolved not in seen:
                          seen.add(resolved)
                          resolved_dirs.append(resolved)
              return resolved_dirs

          submission_dirs: list[str] = []
          changed_paths: list[Path] = []
          if backfill_existing_only:
              print("Backfill existing-only mode enabled; skipping local submission directory resolution.")
          elif manual_submission_dirs.strip():
              seen: set[str] = set()
              for raw_dir in manual_submission_dirs.splitlines():
                  raw_dir = raw_dir.strip()
                  if not raw_dir:
                      continue
                  candidate = Path(raw_dir)
                  if not candidate.is_absolute():
                      candidate = (Path.cwd() / candidate).resolve()
                  manifest = candidate / "leaderboard_manifest.json"
                  if manifest.is_file():
                      resolved = str(candidate)
                      if resolved not in seen:
                          seen.add(resolved)
                          submission_dirs.append(resolved)
          elif event_name == "push" and before_sha and current_sha and before_sha != "0000000000000000000000000000000000000000":
              diff_args = [
                  "git",
                  "diff",
                  "--name-only",
                  before_sha,
                  current_sha,
                  "--",
                  "submissions",
                  str(snapshot_root),
              ]
              try:
                  changed_paths = collect_changed_paths(diff_args)
              except subprocess.CalledProcessError:
                  fallback_args = [
                      "git",
                      "diff",
                      "--name-only",
                      "origin/main...HEAD",
                      "--",
                      "submissions",
                      str(snapshot_root),
                  ]
                  print(
                      f"Unable to diff push range {before_sha}..{current_sha}; "
                      "falling back to origin/main...HEAD."
                  )
                  changed_paths = collect_changed_paths(fallback_args)
              submission_dirs = collect_submission_dirs(changed_paths)
          else:
              submission_dirs = [str(path.parent.resolve()) for path in sorted(submissions_root.rglob("leaderboard_manifest.json"))]

          snapshots_changed = any(
              path == snapshot_root or snapshot_root in path.parents
              for path in changed_paths
          )

          print("Submission dirs to sync:")
          for item in submission_dirs:
              print(f"- {item}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"count={len(submission_dirs)}\n")
              fh.write(f"snapshots_changed={'true' if snapshots_changed else 'false'}\n")
              fh.write("dirs<<EOF\n")
              for item in submission_dirs:
                  fh.write(item + "\n")
              fh.write("EOF\n")
          PYEOF
        env:
          BACKFILL_EXISTING_ONLY: ${{ github.event.inputs.backfill_existing_only || 'false' }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_SUBMISSION_DIRS: ${{ github.event.inputs.submission_dirs }}

      - name: Sync submissions into HF leaderboard snapshots
        id: sync-hf
        if: ${{ steps.resolve-submissions.outputs.count != '0' || steps.resolve-submissions.outputs.snapshots_changed == 'true' || github.event.inputs.backfill_existing_only == 'true' || github.event.inputs.skip_aggregation == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.DATASET_WRITE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          BACKFILL_EXISTING_ONLY: ${{ github.event.inputs.backfill_existing_only || 'false' }}
          SKIP_AGGREGATION: ${{ github.event.inputs.skip_aggregation == 'true' || (steps.resolve-submissions.outputs.count == '0' && steps.resolve-submissions.outputs.snapshots_changed == 'true') }}
          VLLM_HUST_REPO: ${{ github.workspace }}/vllm-hust
          VLLM_HUST_WEBSITE_REPO: ${{ github.workspace }}/vllm-hust-website
        run: |
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "ERROR: DATASET_WRITE_TOKEN secret is not set."
            exit 1
          fi

          extra_args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            extra_args+=(--dry-run)
          fi
          if [[ "$BACKFILL_EXISTING_ONLY" == "true" ]]; then
            extra_args+=(--existing-only)
          fi
          if [[ "$SKIP_AGGREGATION" == "true" ]]; then
            extra_args+=(--skip-aggregation)
          fi

          submission_args=()
          if [[ "$SKIP_AGGREGATION" != "true" ]]; then
            while IFS= read -r submission_dir; do
              [[ -z "$submission_dir" ]] && continue
              echo "=== queueing $submission_dir ==="
              submission_args+=(--submission-dir "$submission_dir")
            done <<< "${{ steps.resolve-submissions.outputs.dirs }}"

            if [[ ${#submission_args[@]} -eq 0 && "$BACKFILL_EXISTING_ONLY" != "true" ]]; then
              echo "No submission directories resolved; nothing to sync."
              exit 0
            fi
          else
            echo "=== skip-aggregation mode: uploading existing snapshots directly ==="
          fi

          PYTHONPATH=src python -m vllm_hust_benchmark.cli sync-submission-to-hf \
            "${submission_args[@]}" \
            --aggregate-output-dir leaderboard-data/snapshots \
            --repo-id intellistream/vllm-hust-benchmark-results \
            --submissions-prefix submissions-auto \
            --commit-message "chore: sync benchmark submission and leaderboard data from ${GITHUB_REF} @ ${GITHUB_SHA::8}" \
            --execute \
            "${extra_args[@]}"

      - name: Validate trend admission on aggregated snapshots (post-sync gate)
        id: validate-trend-snapshots
        if: ${{ steps.sync-hf.conclusion == 'success' && github.event.inputs.dry_run != 'true' }}
        run: |
          PYTHONPATH=src python -m vllm_hust_benchmark.cli validate-trend \
            --input leaderboard-data/snapshots/

      - name: Verify HF snapshots match GitHub canonical snapshots
        if: ${{ steps.sync-hf.conclusion == 'success' && github.event.inputs.dry_run != 'true' }}
        env:
          HF_TOKEN: ${{ secrets.DATASET_WRITE_TOKEN }}
        run: |
          python - << 'PYEOF'
          import hashlib
          import json
          from pathlib import Path

          from huggingface_hub import HfApi, hf_hub_download

          repo_id = "intellistream/vllm-hust-benchmark-results"
          snapshot_dir = Path("leaderboard-data/snapshots")
          snapshot_files = (
              "leaderboard_single.json",
              "leaderboard_multi.json",
              "leaderboard_compare.json",
              "last_updated.json",
          )

          api = HfApi()
          revision = api.dataset_info(repo_id=repo_id, revision="main").sha
          failures = []

          for file_name in snapshot_files:
              local_path = snapshot_dir / file_name
              remote_path = Path(
                  hf_hub_download(
                      repo_id=repo_id,
                      repo_type="dataset",
                      filename=file_name,
                      revision=revision,
                      force_download=True,
                  )
              )
              local_bytes = local_path.read_bytes()
              remote_bytes = remote_path.read_bytes()
              local_sha = hashlib.sha256(local_bytes).hexdigest()
              remote_sha = hashlib.sha256(remote_bytes).hexdigest()

              payload = json.loads(remote_bytes)
              if isinstance(payload, list):
                  summary = f"entries={len(payload)}"
              elif "group_count" in payload:
                  summary = f"groups={payload['group_count']}"
              else:
                  summary = f"last_updated={payload.get('last_updated')}"

              print(
                  f"{file_name}: {summary}, github_sha256={local_sha}, "
                  f"hf_sha256={remote_sha}, hf_revision={revision}"
              )
              if local_bytes != remote_bytes:
                  failures.append(file_name)

          if failures:
              raise SystemExit(
                  "HF snapshot verification failed for: " + ", ".join(failures)
              )

          print("HF snapshots match GitHub canonical snapshots byte-for-byte.")
          PYEOF

      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' && (steps.resolve-submissions.outputs.count != '0' || github.event.inputs.backfill_existing_only == 'true') }}
        run: |
          echo "=== DRY RUN: files that would be uploaded ==="
          ls -lh /tmp/leaderboard-data/

      - name: No submissions to sync
        if: ${{ steps.resolve-submissions.outputs.count == '0' && steps.resolve-submissions.outputs.snapshots_changed != 'true' && github.event.inputs.backfill_existing_only != 'true' && github.event.inputs.skip_aggregation != 'true' }}
        run: echo "No submission directories matched this event; nothing to upload."
