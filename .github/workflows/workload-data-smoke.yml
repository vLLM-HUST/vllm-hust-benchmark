name: Workload data CPU correctness smoke

on:
  pull_request:
    paths:
      - 'workload-preparation/**'
      - 'src/vllm_hust_benchmark/workload_data.py'
      - 'src/vllm_hust_benchmark/workload_response_validation.py'
      - 'tests/test_workload*'
      - 'docs/workload-data/**'
      - 'scripts/verify_workload_migration_inputs.py'
      - 'scripts/run_source_request_samples.py'
      - 'scripts/run_tau2_original_telecom.py'
      - 'scripts/run_gsm8k_incremental_samples.py'
      - 'scripts/run_mmlu_pro_original_samples.py'
      - 'scripts/run_structeval_original_json.py'
      - 'scripts/run_longbench_v2_original_samples.py'
      - 'tests/test_tau2_original_runner.py'
      - 'tests/test_reasoning_original_runners.py'
      - 'tests/test_structeval_original_runner.py'
      - 'tests/test_longbench_original_runner.py'
      - 'pyproject.toml'
      - '.github/workflows/workload-data-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software only
        run: |
          python -m pip install build pytest
          python -m build --wheel --outdir workload-data-dist workload-preparation
          python -m pip install '.[workload-validation]' 'workload-data-dist/vllm_hust_workload_data-0.1.0-py3-none-any.whl[data]'
          (cd workload-data-dist && sha256sum *.whl > SHA256SUMS)
          python -c "import json, pathlib, subprocess; p=pathlib.Path('workload-data-dist'); (p/'BUILD_METADATA.json').write_text(json.dumps({'schema_version':'workload-data-build/v1','source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'distribution':'vllm-hust-workload-data','version':'0.1.0'},indent=2)+'\n',encoding='utf-8')"
      - name: CPU fixtures and data-only boundary
        run: python -m pytest -q workload-preparation/tests tests/test_workload_data_boundary.py tests/test_workload_gap_catalog.py tests/test_workload_validation_checklist.py tests/test_workload_category_checklist.py tests/test_tau2_original_runner.py tests/test_reasoning_original_runners.py tests/test_structeval_original_runner.py tests/test_longbench_original_runner.py tests/test_workload_response_validation.py
      - name: Installed CLI and packaged catalogs
        working-directory: ${{ runner.temp }}
        run: |
          workload-data identity
          workload-data sources
          workload-data classes
          workload-data catalog source GSM8K
          workload-data pipeline --help
          workload-data replay --help
      - name: Publish validated software wheel, never datasets
        uses: actions/upload-artifact@v4
        with:
          name: workload-data-${{ github.event.pull_request.head.sha || github.sha }}
          path: workload-data-dist/
          if-no-files-found: error
          retention-days: 30
