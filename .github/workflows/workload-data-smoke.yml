name: Workload data CPU correctness smoke

on:
  pull_request:
    paths:
      - 'workload-preparation/**'
      - 'src/vllm_hust_benchmark/workload_data.py'
      - 'tests/test_workload*'
      - 'docs/workload-data/**'
      - 'scripts/verify_workload_migration_inputs.py'
      - 'pyproject.toml'
      - '.github/workflows/workload-data-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software only
        run: |
          python -m pip install build pytest
          python -m pip install . './workload-preparation[data]'
      - name: CPU fixtures and data-only boundary
        run: python -m pytest -q workload-preparation/tests tests/test_workload_data_boundary.py tests/test_workload_gap_catalog.py tests/test_workload_validation_checklist.py
      - name: Installed CLI and packaged catalogs
        working-directory: ${{ runner.temp }}
        run: |
          workload-data identity
          workload-data sources
          workload-data classes
          workload-data catalog source GSM8K
          workload-data pipeline --help
          workload-data replay --help
