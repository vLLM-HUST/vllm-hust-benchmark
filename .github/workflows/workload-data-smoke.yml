name: Workload data CPU correctness smoke

on:
  pull_request:
    paths:
      - 'workload-preparation/**'
      - 'src/vllm_hust_benchmark/workload_data.py'
      - 'src/vllm_hust_benchmark/workload_response_validation.py'
      - 'tests/test_workload*'
      - 'docs/workload-data/**'
      - 'scripts/verify_workload_migration_inputs.py'
      - 'scripts/run_source_request_samples.py'
      - 'scripts/run_tau2_original_telecom.py'
      - 'scripts/run_gsm8k_incremental_samples.py'
      - 'scripts/run_arc_original_samples.py'
      - 'scripts/run_mmlu_pro_original_samples.py'
      - 'scripts/run_structeval_original_json.py'
      - 'scripts/run_longbench_v2_original_samples.py'
      - 'scripts/run_dolly_original_samples.py'
      - 'scripts/run_dolly_original_categories.py'
      - 'scripts/run_longwriter_original_samples.py'
      - 'scripts/run_agentbench_alfworld_original.py'
      - 'scripts/run_humaneval_original_generation.py'
      - 'scripts/run_longbench_v1_qasper_original.py'
      - 'scripts/run_bfcl_v4_simple_python_original.py'
      - 'scripts/run_oasst_original_continuation.py'
      - 'scripts/run_natural_instructions_original.py'
      - 'scripts/run_ni_original_range.py'
      - 'tests/test_ni_original_range.py'
      - 'scripts/run_ni_editing_extraction_original.py'
      - 'scripts/run_bbh_boolean_original.py'
      - 'scripts/run_bbh_original_tasks.py'
      - 'scripts/run_math500_original_samples.py'
      - 'scripts/run_math500_native.py'
      - 'scripts/run_quality_original_mc.py'
      - 'scripts/run_jsonschemabench_original_schema.py'
      - 'scripts/run_bigcodebench_original_generation.py'
      - 'scripts/run_ds1000_original_generation.py'
      - 'scripts/run_locomo_original_qa.py'
      - 'tests/test_locomo_original_qa_runner.py'
      - 'scripts/run_burstgpt_original_example.py'
      - 'tests/test_burstgpt_original_example.py'
      - 'scripts/build_agentbench_pddl_runtime_wheels.py'
      - 'configs/workload-native/**'
      - 'tests/test_tau2_original_runner.py'
      - 'tests/test_reasoning_original_runners.py'
      - 'tests/test_math500_original_runner.py'
      - 'tests/test_math500_native_runner.py'
      - 'tests/test_native_delivery_contract.py'
      - 'tests/test_structeval_original_runner.py'
      - 'tests/test_longbench_original_runner.py'
      - 'tests/test_dolly_original_runner.py'
      - 'tests/test_dolly_original_categories.py'
      - 'tests/test_longwriter_original_runner.py'
      - 'tests/test_agentbench_original_runner.py'
      - 'tests/test_bfcl_original_runner.py'
      - 'tests/test_oasst_original_runner.py'
      - 'tests/test_natural_instructions_original_runner.py'
      - 'tests/test_natural_instructions_validation_receipt.py'
      - 'tests/test_ni_editing_extraction_original.py'
      - 'tests/test_bbh_original_runner.py'
      - 'tests/test_bbh_validation_receipt.py'
      - 'tests/test_quality_original_mc_runner.py'
      - 'tests/test_jsonschemabench_original_runner.py'
      - 'tests/test_bigcodebench_original_generation.py'
      - 'tests/test_ds1000_original_generation.py'
      - 'pyproject.toml'
      - '.github/workflows/workload-data-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software only
        run: |
          python -m pip install build pytest
          python -m build --wheel --outdir workload-data-dist workload-preparation
          python -m pip install '.[workload-validation]' 'workload-data-dist/vllm_hust_workload_data-0.1.0-py3-none-any.whl[data]'
          (cd workload-data-dist && sha256sum *.whl > SHA256SUMS)
          python -c "import json, pathlib, subprocess; p=pathlib.Path('workload-data-dist'); (p/'BUILD_METADATA.json').write_text(json.dumps({'schema_version':'workload-data-build/v1','source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'distribution':'vllm-hust-workload-data','version':'0.1.0'},indent=2)+'\n',encoding='utf-8')"
      - name: CPU fixtures and data-only boundary
        run: python -m pytest -q workload-preparation/tests tests/test_workload_data_boundary.py tests/test_workload_gap_catalog.py tests/test_workload_validation_checklist.py tests/test_workload_category_checklist.py tests/test_tau2_original_runner.py tests/test_reasoning_original_runners.py workload-preparation/tests/test_math500_original_adapter.py tests/test_math500_original_runner.py tests/test_structeval_original_runner.py tests/test_longbench_original_runner.py tests/test_dolly_original_runner.py tests/test_longwriter_original_runner.py tests/test_agentbench_original_runner.py tests/test_bfcl_original_runner.py tests/test_workload_response_validation.py
      - name: OASST runner CPU contract only
        run: python -m pytest -q tests/test_oasst_original_runner.py
      - name: Natural Instructions runner CPU contract only
        run: python -m pytest -q tests/test_natural_instructions_original_runner.py tests/test_natural_instructions_validation_receipt.py tests/test_ni_editing_extraction_original.py tests/test_ni_original_range.py
      - name: BBH runner CPU contract only
        run: python -m pytest -q tests/test_bbh_original_runner.py tests/test_bbh_validation_receipt.py
      - name: Native evaluation delivery contracts, no model calls
        run: python -m pytest -q tests/test_math500_native_runner.py tests/test_native_delivery_contract.py
      - name: Dolly original category coverage software contracts
        run: python -m pytest -q tests/test_dolly_original_categories.py
      - name: QuALITY runner CPU contract only
        run: python -m pytest -q tests/test_quality_original_mc_runner.py
      - name: JSONSchemaBench runner CPU contract only
        run: python -m pytest -q tests/test_jsonschemabench_original_runner.py
      - name: BigCodeBench generation CPU contract only
        run: python -m pytest -q tests/test_bigcodebench_original_generation.py
      - name: DS1000 generation CPU contract only
        run: python -m pytest -q tests/test_ds1000_original_generation.py
      - name: LoCoMo protocol and BurstGPT transport software contracts only
        run: python -m pytest -q tests/test_locomo_original_qa_runner.py tests/test_burstgpt_original_example.py
      - name: Installed CLI and packaged catalogs
        working-directory: ${{ runner.temp }}
        run: |
          workload-data identity
          workload-data sources
          workload-data classes
          workload-data catalog source GSM8K
          workload-data pipeline --help
          workload-data replay --help
      - name: Publish validated software wheel, never datasets
        uses: actions/upload-artifact@v4
        with:
          name: workload-data-${{ github.event.pull_request.head.sha || github.sha }}
          path: workload-data-dist/
          if-no-files-found: error
          retention-days: 30
