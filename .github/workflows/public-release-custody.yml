name: Public Release Custody

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/public-release-custody.yml
      - scripts/verify_public_release_assets.py
      - tests/test_public_release_assets.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure archive decoder
        run: command -v zstd || sudo apt-get install -y zstd
      - name: Verify public assets and TraceLoom members
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_public_release_assets.py --output public-release-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-verification
          path: public-release-verification.json
          if-no-files-found: error
