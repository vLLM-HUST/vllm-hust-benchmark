name: Merge Gate

on:
  repository_dispatch:
    types: [merge-gate-check]
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [mock, real]
        default: mock
      scenario:
        required: false
        type: choice
        options: [pass, fail_config_drift, fail_data_source, fail_unpaired_spec]
        default: pass
      repository:
        required: false
        type: string
        default: vLLM-HUST/vllm-hust
      core_revision:
        required: false
        type: string
        default: main
      plugin_repository:
        required: false
        type: string
        default: vLLM-HUST/vllm-ascend-hust
      plugin_revision:
        required: false
        type: string
        default: main
      target_id:
        required: false
        type: string
        default: official-ascend-jan-2026-v0.18.0-random-online-qwen25-14b-910b2

permissions:
  contents: read

jobs:
  mock-contract-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'mock' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Exercise merge-gate contract
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          python scripts/generate_mock_merge_gate_artifacts.py \
            --scenario "$SCENARIO" --output-dir artifacts/merge-gate

  submit-real-check-to-112:
    if: ${{ github.event_name == 'repository_dispatch' || inputs.mode == 'real' }}
    uses: vLLM-HUST/vllm-hust-dev-hub/.github/workflows/evaluation-request.yml@main
    with:
      repository: ${{ github.event.client_payload.repository || inputs.repository }}
      core_revision: ${{ github.event.client_payload.core_revision || inputs.core_revision }}
      plugin_repository: ${{ github.event.client_payload.plugin_repository || inputs.plugin_repository }}
      plugin_revision: ${{ github.event.client_payload.plugin_revision || inputs.plugin_revision }}
      target_id: ${{ github.event.client_payload.target_id || inputs.target_id }}
      target_registry_version: 1.3.5
      repeat_count: 3
      npu_count: 1
      priority: required
    secrets:
      evaluation_api_url: ${{ secrets.EVALUATION_API_URL }}
      evaluation_api_token: ${{ secrets.EVALUATION_API_TOKEN }}
      evaluation_hmac_secret: ${{ secrets.EVALUATION_HMAC_SECRET }}
