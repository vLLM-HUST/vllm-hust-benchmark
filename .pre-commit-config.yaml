default_language_version:
  python: python3

# Frozen calibration report capsules use member manifests for byte checks;
# formatter exclusions preserve their original endings and frozen profile identities.
# Byte-preserved audit/remote receipts: validated by SHA, not rewritten by formatters.
exclude: ^(reports/muxpd-counterfactual-20261028/release-api-v1[.]json$|reports/pegaflow-(pd-(serial-validation|capacity-batching|serving-scenario)|simulation-progress)-20261027/provenance/|reports/terminal-openssl-model-recovery-20261026/(derive_private|recovery)[.]py[.]source$|reports/hle-native018-completed-20261026/|reports/vllm-hust-midterm-20261019/中期测试报告-v083[.]md$|reports/muxpd-followup-20261025/quality-reference-v5/(public-readback-v5/((READBACK[.]md|public_readback_v5[.]py|test_public_readback_v5[.]py)$|attempt-01/assets/QUALITY-REFERENCE-v5[.]md$|attempt-01/(previous57-(preupload|v4-public)-api|release-api-(after|before))[.]json$)|REPORT(-DRAFT-v1|-v5)[.]md$|analysis/(prior57-release-api-v5[.]json$|mixed-profile/all-runtime-api-comparisons-v1[.]csv[.]source$|native-reference/all-window-metrics[.]csv[.]source$))|reports/muxpd-followup-20261025/public-readback-v2/|reports/vllm-hust-midterm-20261019/m01-recovery/wholechain-reference-20261025/original-reference-policy-v2[.]md$|reports/frontierscience-native018-paired-20261025/|reports/vllm-hust-midterm-20261019/m01-recovery/(storage-reference-closed-20261024/(profiling-final-dag-audit-r5|public-release-readback)|official018-paired-compute-20261024/public-own-metrics-r2-release-readback)[.]json$)

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
    exclude: "(?:^reports/pegaflow-(multinode-calibration|pipeline-generalization)-20261027/)|(?:(^reports/vllm-hust-midterm-20261019/milestone-v15/(project4-v1[.]5[.](txt|json)|manifest[.]json)$|^reports/frontierscience-combination-quality-20261022/per_case\\.csv$|^website-publication/data/|^reports/latchmoe-five-datasets-20261010/(.*\\.log|model-lock\\.json)$|^reports/(issue_134_raw_artifacts|historical-recovery-evidence|issue_135_readiness_slo_matrix|issue-214-v018-three-repeat-20261007|issue-136-evaluation-112-roundtrip-20261006|issue-136-current-main-fixed-1-rps-20261007|issue-136-current-main-fixed-1-rps-20261007-review)/.*$|^reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\\.md$|^submissions/|^archive/))"
  - id: end-of-file-fixer
    # Frozen source endings and raw API bytes are preserved and checked by SHA.
    exclude: "(?:^reports/pegaflow-(multinode-calibration|pipeline-generalization)-20261027/)|(?:(^reports/swe-native018-(batch|repository)-20261026/derive_private[.]py[.]source$|^reports/muxpd-followup-20261025/performance-lifecycle-v4/public-readback-v4/verify_public_readback_v4[.]py[.]snapshot$|^reports/muxpd-followup-20261025/performance-lifecycle-v4/public-readback-v4/attempt-01/(previous39-(preupload|v3-public)-api|release-api-(before|after))[.]json$|^reports/muxpd-followup-20261025/device-evidence-v3/public-readback-v3/(attempt-0[123]/release-api-(after|before)|previous23-release-api)[.]json$|^reports/muxpd-ecpa-20261025/(evidence|publication)-release-api[.]json$|^reports/vllm-hust-midterm-20261019/milestone-v15/(project4-v1[.]5[.](txt|json)|manifest[.]json)$|^reports/mmlu-quality018-20261022/cache-policy[.]json$|^website-publication/data/|^reports/latchmoe-five-datasets-20261010/(.*\\.log|model-lock\\.json)$|^reports/(issue_134_raw_artifacts|historical-recovery-evidence|issue_135_readiness_slo_matrix|issue-214-v018-three-repeat-20261007|issue-136-evaluation-112-roundtrip-20261006|issue-136-current-main-fixed-1-rps-20261007|issue-136-current-main-fixed-1-rps-20261007-review)/.*$|^reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\\.md$|^submissions/|^archive/))"
  - id: check-yaml
    args: [--unsafe]
  - id: check-json
    # Frozen raw records include original empty/invalid JSON. Custody tests
    # verify bytes and the explicit invalid_json_paths inventory instead.
    exclude: ^archive/mod-git-2026102[12]/[^/]+/snapshot/
  - id: check-toml
  - id: check-added-large-files
    args: ["--maxkb=1000"]
    # Five byte-preserved public SimLLM originals (1.3–1.6 MB each),
    # verified against the frozen custody manifest by test_website_source_custody.
    # Manager archive parts preserve existing public Git bytes; every member is
    # size/SHA checked by test_targeted_mod_custody, not regenerated here.
    exclude: ^(archive/mod-targeted-20261023/manager-formal/snapshot/experiments/formal_campaign/artifacts/|archive/mod-git-20261022/website-source-vllm-ascend-simllm-hust/snapshot/benchmarks/results/qwen35_latency_20261008/(tailanchor512-server\.log|simllm-context1008-(tailanchor512|baseline)-full5000-chat\.jsonl|repeat/(plugin5000|baseline5000)\.jsonl)$)
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    args: [--fix=lf]
    # Preserve frozen source CSV bytes; custody tests check their exact SHA256.
    exclude: "(?:^reports/pegaflow-(multinode-calibration|pipeline-generalization)-20261027/)|(?:(^reports/muxpd-followup-20261025/performance-lifecycle-v4/analysis/primary/all-window-metrics[.]csv$|^reports/vllm-hust-midterm-20261019/milestone-v15/(project4-v1[.]5[.](txt|json)|manifest[.]json)$|^reports/frontierscience-combination-quality-20261022/per_case[.]csv$|^website-publication/data/|^reports/latchmoe-five-datasets-20261010/(.*\\.log|model-lock\\.json)$|^reports/(issue_134_raw_artifacts|historical-recovery-evidence|issue_135_readiness_slo_matrix|issue-214-v018-three-repeat-20261007|issue-136-evaluation-112-roundtrip-20261006|issue-136-current-main-fixed-1-rps-20261007|issue-136-current-main-fixed-1-rps-20261007-review)/.*$|^reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\\.md$|^submissions/|^archive/))"
  - id: detect-private-key
  - id: no-commit-to-branch
    name: block commits to main
    args: [--branch, main]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.2
  hooks:
  - id: ruff
    name: ruff check
    args: [--fix]
    # Immutable historical driver: exact bytes are checked by custody tests.
    exclude: "(?:^reports/pegaflow-(multinode-calibration|pipeline-generalization)-20261027/)|(?:^(archive/mod-targeted-20261023/profiler-m0-consumers/snapshot/\\.benchmarks/run_m0_development_validation\\.py$|archive/mod-targeted-20261023/manager-experiments/snapshot/|website-publication/data/|archive/mod-git-2026102[12]/[^/]+/snapshot/|reports/vllm-hust-midterm-20261019/(m06-paired-20261021/|m01-recovery/request-assessment-20261022/)))"
  - id: ruff-format
    name: ruff format
    exclude: "(?:^reports/pegaflow-(multinode-calibration|pipeline-generalization)-20261027/)|(?:^(archive/mod-targeted-20261023/profiler-m0-consumers/snapshot/\\.benchmarks/run_m0_development_validation\\.py$|archive/mod-targeted-20261023/manager-experiments/snapshot/|website-publication/data/|archive/mod-git-2026102[12]/[^/]+/snapshot/|reports/vllm-hust-midterm-20261019/(m06-paired-20261021/|m01-recovery/request-assessment-20261022/)))"

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent=2, --preserve-quotes]
    exclude: ^(\.github/|archive/mod-git-20261022/split-current-git/snapshot/|archive/mod-targeted-20261023/manager-experiments/snapshot/)

- repo: https://github.com/executablebooks/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-gfm
    args: [--wrap=100]
    exclude: "(?:^reports/pegaflow-(multinode-calibration|pipeline-generalization)-20261027/)|(?:^(archive/mod-targeted-20261023/[^/]+/snapshot/.*|CHANGELOG\\.md|archive/mod-git-2026102[12]/[^/]+/snapshot/.*|website-publication/data/.*|reports/(issue-214-v018-three-repeat-20261007|issue-136-evaluation-112-roundtrip-20261006|issue-136-current-main-fixed-1-rps-20261007|issue-136-current-main-fixed-1-rps-20261007-review)/.*|reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\\.md)$)"

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    # Benchmark repo has many known false positives: 40-char git SHAs in
    # tests, fixture JSON containing commit IDs, and dummy API keys used
    # for env-var validation tests. We commit a generated baseline
    # (`.secrets.baseline`) listing them, and the hook blocks only net-new
    # secrets. Regenerate the baseline via:
    #
    #   detect-secrets scan --all-files \
    #     --exclude-files '^(submissions|leaderboard-data|schemas|reports|docs/official-baselines)/.*\.json$|^src/vllm_hust_benchmark/data/official_target.*\.json$|^tests/fixtures/.*|^archive/.*|^agent\.md$|^CHANGELOG\.md$|^\.(git|pytest_cache|ruff_cache|venv|benchmarks)/' \
    #     --exclude-lines 'pragma: allowlist secret' \
    #     > .secrets.baseline
    #
    # Then audit any new entries with `detect-secrets audit .secrets.baseline`.
    # Input-only FrontierScience inventories contain audited public row/prompt hashes.
    args: [--baseline, .secrets.baseline]
    exclude: ^(website-publication/(data/.*|source-audit\.json)|submissions/.*\.json|leaderboard-data/.*\.json|schemas/.*\.json|reports/.*\.(json|txt|log)|reports/pyramidkv-frontierscience-inputs-20261009/(olympiad|research)-inventory\.jsonl|reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\.md|docs/.*\.jsonl?|scripts/build_qwen35_frontier_b1\.py|src/vllm_hust_benchmark/data/(official_target.*|acceptance_v4_6|acceptance_v5_4|acceptance_v5_5)\.json|tests/fixtures/.*|archive/.*|agent\.md|CHANGELOG\.md)$
