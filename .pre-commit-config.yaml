default_language_version:
  python: python3

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: check-yaml
    args: [--unsafe]
  - id: check-json
  - id: check-toml
  - id: check-added-large-files
    args: ["--maxkb=1000"]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: detect-private-key
  - id: no-commit-to-branch
    name: block commits to main
    args: [--branch, main]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.2
  hooks:
  - id: ruff
    name: ruff check
    args: [--fix]
  - id: ruff-format
    name: ruff format

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent=2, --preserve-quotes]
    exclude: ^\.github/

- repo: https://github.com/executablebooks/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-gfm
    args: [--wrap=100]
    exclude: ^CHANGELOG\.md$

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    # Benchmark repo has many known false positives: 40-char git SHAs in
    # tests, fixture JSON containing commit IDs, and dummy API keys used
    # for env-var validation tests. We commit a generated baseline
    # (`.secrets.baseline`) listing them, and the hook blocks only net-new
    # secrets. Regenerate the baseline via:
    #
    #   detect-secrets scan --all-files \
    #     --exclude-files '^(submissions|leaderboard-data|schemas|reports|docs/official-baselines)/.*\.json$|^src/vllm_hust_benchmark/data/official_target.*\.json$|^tests/fixtures/.*|^archive/.*|^agent\.md$|^CHANGELOG\.md$|^\.(git|pytest_cache|ruff_cache|venv|benchmarks)/' \
    #     --exclude-lines 'pragma: allowlist secret' \
    #     > .secrets.baseline
    #
    # Then audit any new entries with `detect-secrets audit .secrets.baseline`.
    args: [--baseline, .secrets.baseline]
    exclude: ^(submissions/.*\.json|leaderboard-data/.*\.json|schemas/.*\.json|reports/.*\.json|docs/.*\.json|src/vllm_hust_benchmark/data/official_target.*\.json|tests/fixtures/.*|archive/.*|agent\.md|CHANGELOG\.md)$
