default_language_version:
  python: python3

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
    exclude: "(^website-publication/data/|^reports/latchmoe-five-datasets-20261010/(.*\\.log|model-lock\\.json)$|^reports/(issue_134_raw_artifacts|historical-recovery-evidence|issue_135_readiness_slo_matrix|issue-214-v018-three-repeat-20261007|issue-136-evaluation-112-roundtrip-20261006|issue-136-current-main-fixed-1-rps-20261007|issue-136-current-main-fixed-1-rps-20261007-review)/.*$|^reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\\.md$|^submissions/|^archive/)"
  - id: end-of-file-fixer
    exclude: "(^website-publication/data/|^reports/latchmoe-five-datasets-20261010/(.*\\.log|model-lock\\.json)$|^reports/(issue_134_raw_artifacts|historical-recovery-evidence|issue_135_readiness_slo_matrix|issue-214-v018-three-repeat-20261007|issue-136-evaluation-112-roundtrip-20261006|issue-136-current-main-fixed-1-rps-20261007|issue-136-current-main-fixed-1-rps-20261007-review)/.*$|^reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\\.md$|^submissions/|^archive/)"
  - id: check-yaml
    args: [--unsafe]
  - id: check-json
    # Frozen raw records include original empty/invalid JSON. Custody tests
    # verify bytes and the explicit invalid_json_paths inventory instead.
    exclude: ^archive/mod-git-2026102[12]/[^/]+/snapshot/
  - id: check-toml
  - id: check-added-large-files
    args: ["--maxkb=1000"]
    # Five byte-preserved public SimLLM originals (1.3–1.6 MB each),
    # verified against the frozen custody manifest by test_website_source_custody.
    exclude: ^archive/mod-git-20261022/website-source-vllm-ascend-simllm-hust/snapshot/benchmarks/results/qwen35_latency_20261008/(tailanchor512-server\.log|simllm-context1008-(tailanchor512|baseline)-full5000-chat\.jsonl|repeat/(plugin5000|baseline5000)\.jsonl)$
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: "(^website-publication/data/|^reports/latchmoe-five-datasets-20261010/(.*\\.log|model-lock\\.json)$|^reports/(issue_134_raw_artifacts|historical-recovery-evidence|issue_135_readiness_slo_matrix|issue-214-v018-three-repeat-20261007|issue-136-evaluation-112-roundtrip-20261006|issue-136-current-main-fixed-1-rps-20261007|issue-136-current-main-fixed-1-rps-20261007-review)/.*$|^reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\\.md$|^submissions/|^archive/)"
  - id: detect-private-key
  - id: no-commit-to-branch
    name: block commits to main
    args: [--branch, main]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.2
  hooks:
  - id: ruff
    name: ruff check
    args: [--fix]
    exclude: ^(website-publication/data/|archive/mod-git-2026102[12]/[^/]+/snapshot/|reports/vllm-hust-midterm-20261019/m06-paired-20261021/)
  - id: ruff-format
    name: ruff format
    exclude: ^(website-publication/data/|archive/mod-git-2026102[12]/[^/]+/snapshot/|reports/vllm-hust-midterm-20261019/m06-paired-20261021/)

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent=2, --preserve-quotes]
    exclude: ^\.github/

- repo: https://github.com/executablebooks/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-gfm
    args: [--wrap=100]
    exclude: ^(CHANGELOG\.md|archive/mod-git-2026102[12]/[^/]+/snapshot/.*|website-publication/data/.*|reports/(issue-214-v018-three-repeat-20261007|issue-136-evaluation-112-roundtrip-20261006|issue-136-current-main-fixed-1-rps-20261007|issue-136-current-main-fixed-1-rps-20261007-review)/.*|reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\.md)$

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    # Benchmark repo has many known false positives: 40-char git SHAs in
    # tests, fixture JSON containing commit IDs, and dummy API keys used
    # for env-var validation tests. We commit a generated baseline
    # (`.secrets.baseline`) listing them, and the hook blocks only net-new
    # secrets. Regenerate the baseline via:
    #
    #   detect-secrets scan --all-files \
    #     --exclude-files '^(submissions|leaderboard-data|schemas|reports|docs/official-baselines)/.*\.json$|^src/vllm_hust_benchmark/data/official_target.*\.json$|^tests/fixtures/.*|^archive/.*|^agent\.md$|^CHANGELOG\.md$|^\.(git|pytest_cache|ruff_cache|venv|benchmarks)/' \
    #     --exclude-lines 'pragma: allowlist secret' \
    #     > .secrets.baseline
    #
    # Then audit any new entries with `detect-secrets audit .secrets.baseline`.
    # Input-only FrontierScience inventories contain audited public row/prompt hashes.
    args: [--baseline, .secrets.baseline]
    exclude: ^(website-publication/(data/.*|source-audit\.json)|submissions/.*\.json|leaderboard-data/.*\.json|schemas/.*\.json|reports/.*\.(json|txt|log)|reports/pyramidkv-frontierscience-inputs-20261009/(olympiad|research)-inventory\.jsonl|reports/qwen35-b0-xlsx-cross-validation-20261008/MANIFEST-engineer-config-e1de9a4d\.md|docs/.*\.jsonl?|scripts/build_qwen35_frontier_b1\.py|src/vllm_hust_benchmark/data/(official_target.*|acceptance_v4_6|acceptance_v5_4|acceptance_v5_5)\.json|tests/fixtures/.*|archive/.*|agent\.md|CHANGELOG\.md)$
