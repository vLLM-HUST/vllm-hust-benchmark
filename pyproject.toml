[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hust-benchmark"
description = "Independent benchmark harness mirroring upstream vLLM benchmark entrypoints and scenario structure."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  {name = "IntelliStream Team"}
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
  "jsonschema>=4",
  "mdformat==1.0.0",
  "mdformat-gfm",
]
publish = ["huggingface_hub>=0.20"]

[project.scripts]
vllm-hust-benchmark = "vllm_hust_benchmark.cli:main"
perfgate = "vllm_hust_benchmark.perfgate:main"
perfgate-baseline = "vllm_hust_benchmark.perfgate_baselines:main"
official-targets = "vllm_hust_benchmark.official_targets:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vllm_hust_benchmark = ["data/*.json"]

[tool.setuptools.dynamic]
version = {attr = "vllm_hust_benchmark._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Match the website repo's default ruff posture: no line-length / target-version
# constraints; rely on ruff's defaults for the hooks that pre-commit invokes.
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# backfill_single_gpu.py has an auto-re-exec interpreter bootstrap block
# (the ``import vllm_hust_benchmark`` probe) before the real imports, so
# ruff's "imports at top of file" rule (E402) cannot apply.
"scripts/backfill_single_gpu.py" = ["E402", "E741"]
# Pre-existing scripts/tests carry a few unused-variable and ambiguous-name
# warnings that are not regressions and not in scope for this infra commit.
"scripts/run_org_member_benchmarks.py" = ["F401", "F811", "F821", "F841", "E741"]
"src/vllm_hust_benchmark/aggregate_results.py" = ["F841"]
"tests/test_aggregate_results.py" = ["F841"]
